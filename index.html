<style>
:root { --deep: #041716; --sea: #0C433C; --ink: #E3F4EE; --muted: #9CC7BB; --line: #1D3F39; --surface: #0A2622; --accent: #52C4A6; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; color: var(--ink); background: radial-gradient(120% 80% at 20% 0%, var(--sea), #062a25 55%, var(--deep)); font: 17px/1.6 "IBM Plex Sans", system-ui, sans-serif; }
.wrap { max-width: 880px; margin: 0 auto; padding: 48px 16px; }
h1 { font: 600 clamp(28px, 4vw, 40px)/1.15 "Source Serif 4", Georgia, serif; margin: 0 0 8px; }
p { color: var(--muted); margin: 0 0 28px; }
a.card { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
a.card:hover { border-color: var(--accent); }
a.card img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
a.card div { padding: 14px 18px 18px; }
a.card h2 { font: 600 22px/1.25 "Source Serif 4", Georgia, serif; margin: 0 0 4px; }
a.card span { color: var(--muted); font-size: 15px; }
</style>
</head>

<div class="wrap">

</div>
